spring.application.name=discord-bot-service
server.port=8091

# Agent IA : appele en REST via la Gateway (route /chat -> ai-agent-service)
# Sans Gateway : AI_AGENT_URL=http://localhost:8090
discord.agent-url=${AI_AGENT_URL:http://localhost:8888}

# Discord : le bot demarre seulement si la variable d'environnement DISCORD_BOT_TOKEN est definie
# (Discord Developer Portal > Applications > Bot > Reset Token).
# Spring la lit comme la propriete discord.bot.token. Ne pas ecrire le token ici (jamais dans Git).

# Actuator
management.endpoints.web.exposure.include=health,info
