spring.application.name=ebank-service
server.port=8082

# Datasource (in-memory H2)
spring.datasource.url=jdbc:h2:mem:ebank-db
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Seed sample bank accounts on startup
ebank.seed-data=true

# Service discovery : s'enregistre dans Eureka (Discovery-Service, port 8761).
# Pour lancer le service seul, sans Eureka : DISCOVERY_ENABLED=false
spring.cloud.discovery.enabled=${DISCOVERY_ENABLED:true}
eureka.client.enabled=${DISCOVERY_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# OpenFeign : URL vide => Feign cherche "customer-service" dans Eureka (load balancer).
# Sans Eureka, donner l'adresse en dur : CUSTOMER_SERVICE_URL=http://localhost:8081
customer-service.url=${CUSTOMER_SERVICE_URL:}

# Circuit Breaker : chaque appel Feign passe par un disjoncteur Resilience4J
# (réglages dans config/CircuitBreakerConfiguration)
spring.cloud.openfeign.circuitbreaker.enabled=true
