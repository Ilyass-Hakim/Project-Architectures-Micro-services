spring.application.name=ebank-service
server.port=8082

# Datasource (in-memory H2)
spring.datasource.url=jdbc:h2:mem:ebank-db
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Seed sample bank accounts on startup
ebank.seed-data=true

# Service discovery (enable with DISCOVERY_ENABLED=true once Eureka is running)
spring.cloud.discovery.enabled=${DISCOVERY_ENABLED:false}
eureka.client.enabled=${DISCOVERY_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
