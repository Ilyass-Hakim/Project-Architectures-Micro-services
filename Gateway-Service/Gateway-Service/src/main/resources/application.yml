server:
  port: 8888

spring:
  application:
    name: gateway-service
  cloud:
    # Eureka (Discovery-Service, port 8761). Sans Eureka : DISCOVERY_ENABLED=false
    discovery:
      enabled: ${DISCOVERY_ENABLED:true}
    gateway:
      server:
        webflux:
          # 1) Routes déclarées : lb://nom-du-service => l'adresse réelle est demandée à Eureka
          #    ex : http://localhost:8888/api/customers
          #    Sans Eureka : CUSTOMER_SERVICE_URI=http://localhost:8081, EBANK_SERVICE_URI=http://localhost:8082
          routes:
            - id: customer-service
              uri: ${CUSTOMER_SERVICE_URI:lb://customer-service}
              predicates:
                - Path=/api/customers/**, /customers/**
            - id: ebank-service
              uri: ${EBANK_SERVICE_URI:lb://ebank-service}
              predicates:
                - Path=/api/bankAccounts/**, /bankAccounts/**
          # 2) Routes dynamiques : une route est créée automatiquement pour chaque service d'Eureka
          #    ex : http://localhost:8888/customer-service/api/customers
          discovery:
            locator:
              enabled: ${DISCOVERY_ENABLED:true}
              lower-case-service-id: true

eureka:
  client:
    enabled: ${DISCOVERY_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        # /actuator/gateway/routes affiche les routes chargées (pratique pour vérifier)
        include: health,info,gateway
  endpoint:
    gateway:
      access: read-only
