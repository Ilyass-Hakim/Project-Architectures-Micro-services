server:
  port: 8888

spring:
  application:
    name: gateway-service
  cloud:
    # Eureka désactivé tant que le Discovery Service n'existe pas
    discovery:
      enabled: ${DISCOVERY_ENABLED:false}
    gateway:
      server:
        webflux:
          # Routes STATIQUES : on indique nous-mêmes l'adresse de chaque service.
          # Une fois Eureka en place, on remplacera http://localhost:808x par lb://nom-du-service
          routes:
            - id: customer-service
              uri: ${CUSTOMER_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/customers/**, /customers/**
            - id: ebank-service
              uri: ${EBANK_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/bankAccounts/**, /bankAccounts/**

eureka:
  client:
    enabled: ${DISCOVERY_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        # /actuator/gateway/routes affiche les routes chargées (pratique pour vérifier)
        include: health,info,gateway
  endpoint:
    gateway:
      access: read-only
