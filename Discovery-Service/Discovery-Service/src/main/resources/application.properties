spring.application.name=discovery-service
server.port=8761

# Eureka Server : il ne s'enregistre pas lui-même et ne récupère pas d'annuaire
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# En local (une seule instance) : pas d'auto-préservation, les services arrêtés
# disparaissent vite du tableau de bord
eureka.server.enable-self-preservation=false
