spring.application.name=ai-agent-service
server.port=8090

# OpenAI : la cle est lue dans la variable d'environnement OPENAI_API_KEY (jamais dans Git)
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=${OPENAI_MODEL:gpt-5-mini}

# MCP Client : l'agent se connecte aux serveurs MCP des micro-services (Streamable-HTTP, endpoint /mcp)
# Customer-Service et EBank-Service doivent etre demarres AVANT l'agent
spring.ai.mcp.client.name=ebank-ai-agent
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=30s
spring.ai.mcp.client.streamable-http.connections.customer-service.url=${CUSTOMER_MCP_URL:http://localhost:8081}
spring.ai.mcp.client.streamable-http.connections.ebank-service.url=${EBANK_MCP_URL:http://localhost:8082}

# Service discovery : s'enregistre dans Eureka (Discovery-Service, port 8761).
# Pour lancer le service seul, sans Eureka : DISCOVERY_ENABLED=false
spring.cloud.discovery.enabled=${DISCOVERY_ENABLED:true}
eureka.client.enabled=${DISCOVERY_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=health,info
