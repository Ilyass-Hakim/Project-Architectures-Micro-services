spring.application.name=customer-service
server.port=8081

# Datasource (in-memory H2)
spring.datasource.url=jdbc:h2:mem:customers-db
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Seed sample customers on startup
customer.seed-data=true

# Service discovery : s'enregistre dans Eureka (Discovery-Service, port 8761).
# Pour lancer le service seul, sans Eureka : DISCOVERY_ENABLED=false
spring.cloud.discovery.enabled=${DISCOVERY_ENABLED:true}
eureka.client.enabled=${DISCOVERY_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# Swagger-UI : http://localhost:8081/swagger-ui.html  (description JSON : /v3/api-docs)
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

# MCP Server (Partie 2) : outils exposés en Streamable-HTTP sur http://localhost:8081/mcp
spring.ai.mcp.server.name=customer-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.instructions=Bank customers tools: list, search and create customers.

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
